    <style>
      body {

        border: 0;
      }

      img {
        display: block;
        margin: 0 auto;
      }

      .icon-external {

        height: 0.8em;

      }

      h1 {

      h2 {
        font-size: 150%;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li {
        line-height: 1.4em;
      }

      p {
        font-size: 100%;
        line-height: 1.4em;
      }

      @media (max-width: 45em) {
        body {
          font-size: 125%;
        }

        h1 {
          font-size: 200%;
        }

        h2 {
